<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06101d">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #06101d;
  color: #b9f7ff;
  font-family: Arial, sans-serif;
  padding: 18px;
}

header {
  text-align: center;
  padding: 18px 0;
}

h1 {
  color: #39e6ff;
  letter-spacing: 5px;
  text-shadow: 0 0 14px #00cde8;
}

#status {
  color: #7e9eac;
  font-size: 13px;
  overflow-wrap: anywhere;
}

#chat {
  height: 48vh;
  min-height: 250px;
  overflow-y: auto;
  border: 1px solid #16465a;
  border-radius: 14px;
  padding: 12px;
  background: #091725;
  scroll-behavior: smooth;
}

.msg {
  padding: 11px;
  margin: 8px 0;
  border-radius: 10px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.jarvis {
  background: #103345;
}

.user {
  background: #174a56;
  text-align: right;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

input {
  flex: 1;
  min-width: 0;
  background: #0c2030;
  color: white;
  border: 1px solid #23657b;
  border-radius: 10px;
  padding: 13px;
}

button {
  background: #00cde8;
  color: #00131c;
  border: 0;
  border-radius: 10px;
  padding: 12px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

button:disabled {
  opacity: .55;
  cursor: wait;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.actions button {
  background: #143747;
  color: #b9f7ff;
  border: 1px solid #23657b;
}

.actions .ai-button {
  background: #00cde8;
  color: #00131c;
  border-color: #39e6ff;
  box-shadow: 0 0 10px #00cde855;
}

#loadAIButton {
  flex: 1 1 100%;
  min-height: 46px;
}

a {
  color: #65eaff;
}

@media (max-width: 380px) {
  body {
    padding: 12px;
  }

  .controls {
    flex-wrap: wrap;
  }

  #sendBtn {
    min-width: 75px;
  }
}
</style>
</head>

<body>

<header>
  <h1>J.A.R.V.I.S</h1>
  <p>ASSISTENTE PESSOAL</p>
  <div id="status" role="status" aria-live="polite">
    Sistema online • A aguardar a IA local
  </div>
</header>

<div id="chat" aria-live="polite">
  <div class="msg jarvis">
    Olá! Sou o JARVIS. Carrega em "Carregar arquivo de IA"
    para selecionar o modelo Gemma. Depois, podes conversar comigo.
  </div>
</div>

<div class="controls">
  <input
    id="msg"
    placeholder="Fala comigo..."
    autocomplete="off"
    aria-label="Mensagem para o JARVIS"
  >
  <button id="sendBtn" onclick="send()">Enviar</button>
</div>

<div class="actions">
  <button onclick="startMic()">🎙️ Falar</button>
  <button onclick="toggleVoice()" id="voiceBtn">🔊 Voz ligada</button>
  <button onclick="sendCommand('ajuda')">❔ Ajuda</button>
  <button onclick="clearChat()">🧹 Limpar</button>

  <button
    class="ai-button"
    id="loadAIButton"
    onclick="chooseJarvisModel()"
  >
    📂 Carregar arquivo de IA
  </button>
</div>

<script>
"use strict";

let voiceOn = true;
let waitingForModel = false;
let modelSelectionRequested = false;
let recognition = null;
let recognitionActive = false;

/* ESTADO DO JARVIS */

function setStatus(text) {
  document.getElementById("status").textContent = String(text);
}

/* RECEBER ESTADOS DO ANDROID */

function onNativeStatus(message) {
  setStatus(message || "Estado não disponível.");
}

function onNativeSpeechError(message) {
  setStatus(message || "Erro no reconhecimento de voz.");
}

/* SELECIONAR MODELO DE IA */

function chooseJarvisModel() {
  const button = document.getElementById("loadAIButton");

  if (
    !window.AndroidVoice ||
    typeof window.AndroidVoice.chooseModel !== "function"
  ) {
    setStatus(
      "Ponte AndroidVoice indisponível. " +
      "Abre o JARVIS pela aplicação Android."
    );
    return;
  }

  try {
    modelSelectionRequested = true;
    button.disabled = true;

    setStatus("A abrir os ficheiros do telemóvel...");

    window.AndroidVoice.chooseModel();

  } catch (error) {
    setStatus(
      "Erro ao abrir o seletor: " +
      (error.message || "erro desconhecido")
    );
  } finally {
    button.disabled = false;
  }
}

/* MENSAGENS */

function addMessage(text, who) {
  const el = document.createElement("div");

  el.className = "msg " + who;
  el.textContent = String(text);

  const chat = document.getElementById("chat");
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!voiceOn) return;

  if (
    window.AndroidVoice &&
    typeof window.AndroidVoice.speak === "function"
  ) {
    try {
      window.AndroidVoice.speak(String(text));
      return;
    } catch (error) {
      console.error("Erro na voz Android:", error);
    }
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(String(text));
    utterance.lang = "pt-BR";
    utterance.volume = 1;
    utterance.rate = 1;

    window.speechSynthesis.speak(utterance);
  }
}

function reply(text) {
  addMessage(text, "jarvis");
  speak(text);
}

/* COMANDOS LOCAIS */

function answer(raw) {
  const msg = raw.toLowerCase().trim();

  if (!msg) {
    return "Escreve alguma coisa para começarmos.";
  }

  if (
    msg.includes("olá") ||
    msg.includes("ola") ||
    msg.includes("bom dia") ||
    msg.includes("boa tarde") ||
    msg.includes("boa noite") ||
    msg === "oi" ||
    msg.startsWith("oi ")
  ) {
    return "Olá! Estou pronto para ajudar. Qual é o teu comando?";
  }

  if (msg.includes("teu nome") || msg.includes("quem és")) {
    return "Sou o JARVIS, o teu assistente pessoal em desenvolvimento.";
  }

  if (msg.includes("horas") || msg.includes("hora agora")) {
    return "São " + new Date().toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit"
    }) + ".";
  }

  if (msg.includes("data") || msg.includes("dia de hoje")) {
    return "Hoje é " + new Date().toLocaleDateString("pt-BR") + ".";
  }

  if (msg.includes("piada")) {
    return "Porque o computador foi ao médico? Porque tinha um vírus!";
  }

  if (msg.includes("motivação") || msg.includes("motivacional")) {
    return "Continua a trabalhar no teu objetivo. Cada passo conta!";
  }

  if (msg.includes("ajuda") || msg.includes("comandos")) {
    return (
      "Podes pedir a hora, a data, uma piada, uma frase motivacional, " +
      "abrir o Google ou YouTube, ou fazer perguntas ao Gemma local."
    );
  }

  return null;
}

function isSettingsCommand(msg) {
  return (
    msg.includes("definições") ||
    msg.includes("configurações") ||
    msg.includes("configuracoes")
  );
}

/* ENVIAR MENSAGENS */

function send() {
  if (waitingForModel) {
    setStatus("Aguarda a resposta anterior do Gemma.");
    return;
  }

  const input = document.getElementById("msg");
  const text = input.value.trim();

  if (!text) {
    setStatus("Escreve uma mensagem primeiro.");
    return;
  }

  addMessage(text, "user");
  input.value = "";

  const msg = text.toLowerCase();

  /* YOUTUBE */

  if (msg.includes("youtube") || msg.includes("you tube")) {
    reply("A abrir o YouTube.");

    if (window.AndroidVoice) {
      window.AndroidVoice.openApp("youtube");
    } else {
      window.location.href = "https://m.youtube.com/";
    }

    return;
  }

  /* GOOGLE */

  if (msg.includes("google")) {
    reply("A abrir o Google.");

    if (window.AndroidVoice) {
      window.AndroidVoice.openApp("google");
    } else {
      window.location.href = "https://www.google.com/";
    }

    return;
  }

  /* DEFINIÇÕES */

  if (isSettingsCommand(msg)) {
    reply("A abrir as definições do Android.");

    if (window.AndroidVoice) {
      window.AndroidVoice.openApp("settings");
    } else {
      setStatus("Abre as definições no teu dispositivo.");
    }

    return;
  }

  /* RESPOSTAS LOCAIS */

  const localAnswer = answer(text);

  if (localAnswer !== null) {
    reply(localAnswer);
    setStatus("Resposta dos comandos locais.");
    return;
  }

  /* MODELO GEMMA */

  if (
    window.AndroidVoice &&
    typeof window.AndroidVoice.askModel === "function"
  ) {
    waitingForModel = true;
    document.getElementById("sendBtn").disabled = true;

    setStatus("A enviar pergunta ao Gemma...");

    try {
      window.AndroidVoice.askModel(text);
    } catch (error) {
      waitingForModel = false;
      document.getElementById("sendBtn").disabled = false;

      setStatus("Erro ao enviar pergunta ao Gemma.");

      reply("Não consegui contactar o modelo local.");
      console.error("Erro askModel:", error);
    }

    return;
  }

  reply(
    "A IA local precisa da aplicação Android e da ponte nativa ativa. " +
    "Podes continuar a usar os comandos básicos."
  );

  setStatus("Ponte Android indisponível.");
}

/* RESPOSTA DO GEMMA */

function onNativeModelResponse(text) {
  waitingForModel = false;
  document.getElementById("sendBtn").disabled = false;

  const response = String(text || "").trim();

  if (!response) {
    setStatus("O Gemma não devolveu uma resposta.");
    reply("Não recebi uma resposta do modelo. Tenta novamente.");
    return;
  }

  setStatus("Gemma local • Resposta recebida");
  reply(response);
}

/* RESULTADO DO MICROFONE */

function onNativeSpeechResult(text) {
  const input = document.getElementById("msg");

  input.value = String(text || "");
  setStatus("Comando de voz reconhecido.");

  if (input.value.trim()) {
    send();
  }
}

/* VOZ */

function toggleVoice() {
  voiceOn = !voiceOn;

  document.getElementById("voiceBtn").textContent =
    voiceOn ? "🔊 Voz ligada" : "🔇 Voz desligada";

  if (!voiceOn && "speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  if (voiceOn) {
    reply("Voz ativada.");
  } else {
    addMessage("Voz desativada.", "jarvis");
  }
}

/* LIMPAR CONVERSA */

function clearChat() {
  document.getElementById("chat").innerHTML = "";
  addMessage("Conversa limpa. Estou pronto!", "jarvis");
}

/* MICROFONE */

function startMic() {
  setStatus("A tentar ativar o microfone...");

  if (
    window.AndroidVoice &&
    typeof window.AndroidVoice.startListening === "function"
  ) {
    try {
      window.AndroidVoice.startListening();
    } catch (error) {
      setStatus("Não foi possível ativar o microfone.");
      console.error("Erro de microfone Android:", error);
    }

    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setStatus("Reconhecimento de voz indisponível neste navegador.");
    return;
  }

  try {
    recognition = new SpeechRecognition();
    recognition.lang = "pt-BR";
    recognition.interimResults = false;
    recognitionActive = true;

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;

      document.getElementById("msg").value = transcript;
      setStatus("Comando de voz reconhecido.");
      send();
    };

    recognition.onerror = function(event) {
      setStatus("Erro de reconhecimento: " + event.error);
    };

    recognition.onend = function() {
      recognitionActive = false;
    };

    recognition.start();

  } catch (error) {
    recognitionActive = false;
    setStatus("Não foi possível iniciar o reconhecimento de voz.");
    console.error("Erro de reconhecimento:", error);
  }
}

/* TECLA ENTER */

document.getElementById("msg").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    send();
  }
});

/* INICIALIZAÇÃO */

window.addEventListener("load", function() {
  if (
    window.AndroidVoice &&
    typeof window.AndroidVoice.chooseModel === "function"
  ) {
    setStatus("Aplicação Android ligada • A aguardar o modelo local");
  } else {
    setStatus("Interface carregada • Ponte Android não detetada");
  }
});
</script>

</body>
</html>
