
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f5dce9">
<title>J.A.R.V.I.S. | Stark Technology</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --state-color: #a88be8;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100dvh;
  color: #292333;
  background:
    radial-gradient(ellipse at 5% 10%, #f8d5e5 0%, transparent 48%),
    radial-gradient(ellipse at 95% 35%, #ccecff 0%, transparent 48%),
    linear-gradient(145deg, #f9e5ed, #e5e7fa 55%, #f5e5ed);
}

.app {
  width: 100%;
  height: 100dvh;
  min-height: 500px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  padding: 0 20px;
}

header {
  width: 100%;
  text-align: center;
  padding-top: max(28px, env(safe-area-inset-top));
}

.brand {
  font-size: 25px;
  font-weight: 500;
  letter-spacing: 2px;
  color: #292333;
  cursor: pointer;
  user-select: none;
}

.subtitle {
  margin-top: 7px;
  font-size: 10px;
  letter-spacing: 2px;
  color: #82778d;
  pointer-events: none;
}

.orb-area {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}

.orb {
  width: min(58vw, 310px);
  height: min(58vw, 310px);
  max-width: 310px;
  max-height: 310px;
  min-width: 190px;
  min-height: 190px;
  border-radius: 50%;
  position: relative;
  overflow: hidden;

  background:
    radial-gradient(ellipse at 28% 35%,
      rgba(255, 172, 225, .95), transparent 48%),
    radial-gradient(ellipse at 75% 32%,
      rgba(166, 192, 255, .95), transparent 50%),
    radial-gradient(ellipse at 65% 78%,
      rgba(255, 239, 222, .95), transparent 48%),
    linear-gradient(135deg, #dba9ed, #c8b7f2 55%, #f2d6e8);

  box-shadow:
    inset -15px -20px 50px rgba(255,255,255,.35),
    inset 12px 10px 35px rgba(255,255,255,.42),
    0 15px 55px rgba(157,116,200,.13);

  animation: orbFloat 6s ease-in-out infinite;
  transition: filter .5s, transform .5s;
}

.orb::before,
.orb::after {
  content: "";
  position: absolute;
  inset: -20%;
  border-radius: 50%;
  filter: blur(24px);
  opacity: .55;
  animation: colorFlow 9s ease-in-out infinite alternate;
}

.orb::before {
  background:
    radial-gradient(circle at 35% 40%,
      #ff8fd1, transparent 42%);
}

.orb::after {
  background:
    radial-gradient(circle at 70% 55%,
      #9bcaff, transparent 45%);
  animation-delay: -4s;
}

.orb-inner {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(
    circle at 50% 45%,
    transparent 35%,
    rgba(255,255,255,.15) 100%
  );
  z-index: 2;
}

@keyframes orbFloat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.025); }
}

@keyframes colorFlow {
  from { transform: translate(-8%, -5%) scale(1); }
  to { transform: translate(9%, 7%) scale(1.2); }
}

.orb.listening {
  animation: listening 1.5s ease-in-out infinite;
  filter: saturate(1.25);
}

.orb.thinking {
  animation: thinking 1.1s ease-in-out infinite;
  filter: hue-rotate(30deg) saturate(1.3);
}

.orb.speaking {
  animation: speaking .75s ease-in-out infinite;
  filter: saturate(1.4) brightness(1.04);
}

@keyframes listening {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}

@keyframes thinking {
  0%, 100% { transform: scale(.97) rotate(0deg); }
  50% { transform: scale(1.055) rotate(5deg); }
}

@keyframes speaking {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.055); }
  50% { transform: scale(1.02); }
  75% { transform: scale(1.07); }
}

.bottom-area {
  width: 100%;
  padding-bottom: max(45px, calc(env(safe-area-inset-bottom) + 25px));
}

.indicator {
  height: 65px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 13px;
  margin-bottom: 28px;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  height: 12px;
}

.dots span {
  width: 11px;
  height: 11px;
  background: #817a8a;
  border-radius: 50%;
  opacity: .8;
  animation: dotPulse 1.2s infinite ease-in-out;
}

.dots span:nth-child(2) {
  animation-delay: .18s;
}

.dots span:nth-child(3) {
  animation-delay: .36s;
}

@keyframes dotPulse {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: .45;
  }
  30% {
    transform: translateY(-5px);
    opacity: 1;
  }
}

#status {
  color: #81798b;
  font-size: 19px;
  text-align: center;
  font-weight: 400;
}

.buttons {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 5px;
}

.action-button {
  width: 100px;
  height: 100px;
  border: none;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: transform .2s, background .2s;
}

.action-button:active {
  transform: scale(.91);
}

.mic-button {
  background: rgba(255,255,255,.88);
  color: #080808;
  box-shadow: 0 5px 25px rgba(120,100,140,.07);
}

.stop-button {
  background: rgba(180,170,195,.17);
  color: #f04444;
}

.action-button svg {
  width: 43px;
  height: 43px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.stop-button svg {
  width: 48px;
  height: 48px;
  stroke-width: 3.5;
}

.action-button:disabled {
  opacity: .5;
}

@media(max-height: 650px) {
  .orb {
    width: min(48vw, 230px);
    height: min(48vw, 230px);
  }

  .action-button {
    width: 78px;
    height: 78px;
  }

  .indicator {
    margin-bottom: 15px;
  }

  #status {
    font-size: 16px;
  }
}
</style>
</head>

<body>
<div class="app">

  <header onclick="chooseModel()" title="Toque para selecionar o modelo">
    <div class="brand">J.A.R.V.I.S.</div>
    <div class="subtitle">STARK TECHNOLOGY</div>
  </header>

  <main class="orb-area">
    <div class="orb" id="orb">
      <div class="orb-inner"></div>
    </div>
  </main>

  <section class="bottom-area">

    <div class="indicator">
      <div class="dots" id="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div id="status" role="status" aria-live="polite">
        Toque no microfone para falar
      </div>
    </div>

    <div class="buttons">

      <button
        id="micButton"
        class="action-button mic-button"
        type="button"
        onclick="startMic()"
        aria-label="Começar a falar">

        <svg viewBox="0 0 48 48">
          <rect x="17" y="4" width="14" height="27" rx="7"
                fill="currentColor" stroke="none"/>
          <path d="M10 23v2a14 14 0 0 0 28 0v-2"/>
          <path d="M24 39v6"/>
          <path d="M17 45h14"/>
        </svg>
      </button>

      <button
        id="stopButton"
        class="action-button stop-button"
        type="button"
        onclick="stopEverything()"
        aria-label="Interromper">

        <svg viewBox="0 0 48 48">
          <path d="M10 10L38 38M38 10L10 38"/>
        </svg>
      </button>

    </div>
  </section>
</div>

<input id="userInput" type="hidden">

<script>
"use strict";

let waitingForModel = false;
let recognitionActive = false;
let handsFreeEnabled = false;
let voiceEnabled = true;
let browserRecognition = null;
let suppressNextSpeech = false;
let lastSubmittedText = "";
let lastSubmittedTime = 0;

const userInput = document.getElementById("userInput");
const micButton = document.getElementById("micButton");
const stopButton = document.getElementById("stopButton");
const statusElement = document.getElementById("status");
const orb = document.getElementById("orb");
const dots = document.getElementById("dots");

function setState(state, message) {
  orb.classList.remove("listening", "thinking", "speaking");

  if (state === "listening") {
    orb.classList.add("listening");
    dots.style.visibility = "hidden";
  } else if (state === "thinking") {
    orb.classList.add("thinking");
    dots.style.visibility = "visible";
  } else if (state === "speaking") {
    orb.classList.add("speaking");
    dots.style.visibility = "hidden";
  } else {
    dots.style.visibility = "visible";
  }

  if (message) {
    statusElement.textContent = message;
  }
}

function setWaiting(value) {
  waitingForModel = Boolean(value);

  if (waitingForModel) {
    setState("thinking", "A pensar...");
  } else {
    setState("idle", "Toque no microfone para falar");
  }
}

function notifyNativeResponseFinished() {
  try {
    if (window.AndroidVoice &&
        typeof window.AndroidVoice.responseFinished === "function") {
      window.AndroidVoice.responseFinished();
    }
  } catch (error) {
    console.warn(error);
  }
}

// VOZ

function speak(text) {
  const clean = String(text || "").trim();

  if (!clean || !voiceEnabled || suppressNextSpeech) {
    suppressNextSpeech = false;
    setState("idle", "Toque no microfone para falar");
    notifyNativeResponseFinished();
    return;
  }

  setState("speaking", "A falar...");

  try {
    if (window.AndroidVoice &&
        typeof window.AndroidVoice.speak === "function") {
      window.AndroidVoice.speak(clean);
      return;
    }
  } catch (error) {
    console.warn("Erro na voz Android:", error);
  }

  if ("speechSynthesis" in window) {
    try {
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = "pt-BR";

      utterance.onend = function() {
        onNativeSpeechFinished();
        notifyNativeResponseFinished();
      };

      utterance.onerror = function() {
        onNativeSpeechFinished();
        notifyNativeResponseFinished();
      };

      window.speechSynthesis.speak(utterance);
      return;
    } catch (error) {
      console.warn(error);
    }
  }

  onNativeSpeechFinished();
  notifyNativeResponseFinished();
}

function stopEverything() {
  suppressNextSpeech = true;

  waitingForModel = false;
  recognitionActive = false;
  handsFreeEnabled = false;

  micButton.disabled = false;

  try {
    if (browserRecognition) {
      browserRecognition.abort();
      browserRecognition = null;
    }
  } catch (error) {
    console.warn(error);
  }

  try {
    if (window.AndroidVoice &&
        typeof window.AndroidVoice.stopEverything === "function") {
      window.AndroidVoice.stopEverything();
    } else if (window.AndroidVoice &&
               typeof window.AndroidVoice.cancelPendingRequest === "function") {
      window.AndroidVoice.cancelPendingRequest();
    } else {
      if (window.AndroidVoice &&
          typeof window.AndroidVoice.stopListening === "function") {
        window.AndroidVoice.stopListening();
      }

      if (window.AndroidVoice &&
          typeof window.AndroidVoice.stopSpeaking === "function") {
        window.AndroidVoice.stopSpeaking();
      }
    }
  } catch (error) {
    console.warn(error);
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  setState("idle", "Interrompido");
}

function updateHandsFreeState(enabled) {
  handsFreeEnabled = Boolean(enabled);
}

// CARREGAR MODELO

function chooseModel() {
  try {
    if (window.AndroidVoice &&
        typeof window.AndroidVoice.chooseModel === "function") {
      window.AndroidVoice.chooseModel();
    } else {
      setState("idle", "Seletor de modelo indisponível.");
    }
  } catch (error) {
    console.warn(error);
    setState("idle", "Não foi possível abrir o seletor.");
  }
}

// RESPOSTAS LOCAIS

function normalizeText(text) {
  return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function answer(raw) {
  const msg = normalizeText(raw);

  if (/^(ola|oi|bom dia|boa tarde|boa noite|e ai|tudo bem)[!.?]*$/.test(msg))
    return "Olá! Sou o JARVIS. Como posso ajudar-te?";

  if (/^(qual e o teu nome|como te chamas|quem es|o que es)[?!.]*$/.test(msg))
    return "Sou o JARVIS, o teu assistente de inteligência artificial.";

  if (/^(conta|diz|quero) uma piada[!.?]*$/.test(msg))
    return "Porque é que o computador foi ao médico? Porque tinha um vírus!";

  if (/^(da-me|manda-me|quero uma) frase de motivacao[!.?]*$/.test(msg))
    return "Continua a aprender e a melhorar. Cada pequeno passo aproxima-te do teu objetivo!";

  if (/^(que horas sao|diz-me as horas|qual e a hora agora)[?!.]*$/.test(msg))
    return "A hora indicada pelo dispositivo é " +
      new Date().toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
      }) + ".";

  if (/^(que dia e hoje|qual e a data de hoje|diz-me a data)[?!.]*$/.test(msg))
    return "A data indicada pelo dispositivo é " +
      new Date().toLocaleDateString("pt-BR") + ".";

  return null;
}

// COMANDOS ANDROID

function handleExplicitCommand(text) {
  const msg = normalizeText(text);

  let app = null;

  if (/^(abre|abrir|inicia|iniciar|vai para) o? ?youtube$/.test(msg))
    app = "youtube";

  else if (/^(abre|abrir|inicia|iniciar|vai para) o? ?google$/.test(msg))
    app = "google";

  else if (/^(abre|abrir|vai para) (as )?(definicoes|configuracoes)$/.test(msg))
    app = "settings";

  if (!app) return false;

  try {
    if (window.AndroidVoice &&
        typeof window.AndroidVoice.openApp === "function") {
      setWaiting(true);
      setState("thinking", "A executar comando...");
      window.AndroidVoice.openApp(app);
    } else {
      speak("A função de abrir aplicações não está disponível.");
    }
  } catch (error) {
    console.warn(error);
    setWaiting(false);
    speak("Não consegui executar esse comando.");
  }

  return true;
}

// ENVIO PARA O GEMMA

function send(text) {
  text = String(text || "").trim();

  if (!text || waitingForModel) return;

  const now = Date.now();

  if (text === lastSubmittedText &&
      now - lastSubmittedTime < 1200) {
    return;
  }

  lastSubmittedText = text;
  lastSubmittedTime = now;

  suppressNextSpeech = false;

  if (handleExplicitCommand(text)) return;

  const localAnswer = answer(text);

  if (localAnswer !== null) {
    speak(localAnswer);
    return;
  }

  if (!window.AndroidVoice ||
      typeof window.AndroidVoice.askModel !== "function") {
    speak("O modelo de inteligência artificial não está disponível. Verifica a integração com o Gemma local.");
    return;
  }

  try {
    setWaiting(true);
    window.AndroidVoice.askModel(text);
  } catch (error) {
    setWaiting(false);
    speak("Não consegui consultar o modelo de inteligência artificial.");
    console.warn(error);
  }
}

// MICROFONE

function startMic() {
  if (recognitionActive || waitingForModel) return;

  suppressNextSpeech = false;

  if (window.AndroidVoice &&
      typeof window.AndroidVoice.startListening === "function") {
    try {
      recognitionActive = true;
      micButton.disabled = true;

      setState("listening", "Estou a ouvir...");

      window.AndroidVoice.startListening();
      return;
    } catch (error) {
      recognitionActive = false;
      micButton.disabled = false;
      console.warn(error);
    }
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setState("idle", "Microfone indisponível");
    return;
  }

  try {
    browserRecognition = new SpeechRecognition();
    browserRecognition.lang = "pt-BR";
    browserRecognition.interimResults = false;
    browserRecognition.maxAlternatives = 1;

    recognitionActive = true;
    micButton.disabled = true;

    setState("listening", "Estou a ouvir...");

    browserRecognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;

      recognitionActive = false;
      micButton.disabled = false;
      browserRecognition = null;

      send(transcript);
    };

    browserRecognition.onerror = function(event) {
      recognitionActive = false;
      micButton.disabled = false;
      browserRecognition = null;

      setState("idle", "Não consegui ouvir. Tenta novamente.");
      console.warn("Erro de reconhecimento:", event.error);
    };

    browserRecognition.onend = function() {
      recognitionActive = false;
      micButton.disabled = false;
      browserRecognition = null;

      if (!waitingForModel &&
          !orb.classList.contains("speaking")) {
        setState("idle", "Toque no microfone para falar");
      }
    };

    browserRecognition.start();

  } catch (error) {
    recognitionActive = false;
    micButton.disabled = false;
    setState("idle", "Erro ao iniciar o microfone");
    console.warn(error);
  }
}

// RESPOSTAS NATIVAS

function onNativeModelResponse(text) {
  const response = String(text || "").trim();

  if (!waitingForModel) return;

  setWaiting(false);

  if (!response) {
    speak("O modelo não devolveu uma resposta.");
    return;
  }

  speak(response);
}

window.onNativeModelResponse = onNativeModelResponse;
window.onModelResponse = onNativeModelResponse;

function onNativeModelError(message) {
  if (!waitingForModel) return;

  setWaiting(false);

  speak("Ocorreu um erro no modelo: " +
    String(message || "erro desconhecido"));
}

window.onNativeModelError = onNativeModelError;
window.onModelError = onNativeModelError;

function onNativeSpeechResult(text) {
  recognitionActive = false;
  micButton.disabled = false;

  if (text) {
    send(text);
  } else {
    setState("idle", "Não reconheci a frase. Tenta novamente.");
    notifyNativeResponseFinished();
  }
}

function onNativeSpeechError(message) {
  recognitionActive = false;
  micButton.disabled = false;

  setState("idle", message || "Erro no reconhecimento de voz");
}

function onNativeSpeechFinished() {
  recognitionActive = false;
  micButton.disabled = false;

  if (!waitingForModel) {
    setState("idle", "Toque no microfone para falar");
  }
}

window.onNativeSpeechFinished = onNativeSpeechFinished;

function onNativeHandsFreeState(enabled, message) {
  updateHandsFreeState(enabled);

  if (message) {
    setState(enabled ? "listening" : "idle", message);
  }
}

function onNativeStatus(message) {
  const value = String(message || "");

  if (/ouvindo|a ouvir|escutando/i.test(value)) {
    setState("listening", value);
  } else if (/pensando|processando|carregando|a processar|a preparar|a inicializar/i.test(value)) {
    setState("thinking", value);
  } else if (/falando|a falar/i.test(value)) {
    setState("speaking", value);
  } else if (/interrompido|toque no microfone|voz android pronta|interface pronta/i.test(value)) {
    if (!waitingForModel) {
      setState("idle", value);
    }
  }
}

function onNativeModelLoaded(message) {
  setState("idle", message || "Gemma local pronto");
}

// ARRANQUE

window.addEventListener("load", function() {
  setState("idle", "A preparar o J.A.R.V.I.S...");
});
</script>
</body>
</html>
