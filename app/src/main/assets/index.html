
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06101d">
<title>J.A.R.V.I.S AI</title>

<style>
:root {
  --cyan: #39e6ff;
  --blue: #008cff;
  --dark: #06101d;
  --panel: #091725;
  --line: #16465a;
  --text: #b9f7ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% 28%, #06304a 0%, transparent 38%),
    linear-gradient(180deg, #06101d, #020912);
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .25;
  background-image:
    linear-gradient(#0c648022 1px, transparent 1px),
    linear-gradient(90deg, #0c648022 1px, transparent 1px);
  background-size: 30px 30px;
}

header {
  text-align: center;
  padding: 12px 0 14px;
  border-bottom: 1px solid #167b9c66;
}

h1 {
  margin: 0;
  font-size: clamp(27px, 7vw, 38px);
  letter-spacing: 6px;
  color: var(--cyan);
  text-shadow: 0 0 8px #00d9ff, 0 0 24px #008cff99;
}

.subtitle {
  margin: 7px 0;
  font-size: 11px;
  letter-spacing: 3px;
  color: #72dfff;
}

#status {
  margin-top: 9px;
  color: #8aaeba;
  font-size: 12px;
}

.visual {
  display: grid;
  grid-template-columns: 1fr;
  justify-items: center;
  padding: 12px 0 14px;
}

.radar {
  width: min(72vw, 290px);
  aspect-ratio: 1;
  position: relative;
  border-radius: 50%;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(circle, #0a567766 0%, #04283b55 40%, #06101d 72%);
  border: 1px solid #1bcfff66;
  box-shadow:
    0 0 18px #00cfff22,
    inset 0 0 24px #00bfff22;
}

.radar::before,
.radar::after {
  content: "";
  position: absolute;
  inset: 8%;
  border: 1px solid #28cfff66;
  border-radius: 50%;
}

.radar::after {
  inset: 20%;
  border-color: #28cfff88;
}

.ring {
  position: absolute;
  inset: 4%;
  border: 2px solid transparent;
  border-top-color: var(--cyan);
  border-bottom-color: #0879c9;
  border-radius: 50%;
  animation: rotate 8s linear infinite;
  filter: drop-shadow(0 0 5px #00d9ff);
}

.ring.r2 {
  inset: 13%;
  border-width: 3px;
  border-top-color: #0879c9;
  border-right-color: #39e6ff;
  animation-duration: 5s;
  animation-direction: reverse;
}

.ring.r3 {
  inset: 25%;
  border-width: 2px;
  border-left-color: var(--cyan);
  border-right-color: #008cff;
  animation-duration: 3s;
}

.ring.r4 {
  inset: 35%;
  border-width: 1px;
  border-top-color: #fff;
  border-bottom-color: var(--cyan);
  animation-duration: 2s;
}

.radar-grid {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    linear-gradient(90deg, transparent 49.7%, #20cfff55 50%, transparent 50.3%),
    linear-gradient(0deg, transparent 49.7%, #20cfff55 50%, transparent 50.3%);
}

.sweep {
  position: absolute;
  inset: 5%;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    transparent 290deg,
    #00cfff08 310deg,
    #00cfff22 335deg,
    #39e6ff99 359deg,
    transparent 360deg
  );
  animation: rotate 4s linear infinite;
}

.core {
  position: absolute;
  width: 24%;
  aspect-ratio: 1;
  top: 38%;
  left: 38%;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #39e6ff 18%, #008cff 48%, #03406a 72%);
  box-shadow:
    0 0 15px #00d9ff,
    0 0 38px #008cff,
    0 0 60px #00d9ff55;
  animation: pulse 2s ease-in-out infinite;
}

.core::after {
  content: "";
  position: absolute;
  inset: -35%;
  border: 1px solid #39e6ff;
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite reverse;
}

.dot {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 9px 3px #00d9ff;
  animation: blink 1.6s ease-in-out infinite;
}

.d1 { top: 22%; left: 69%; }
.d2 { top: 69%; left: 23%; animation-delay: .4s; }
.d3 { top: 78%; left: 66%; animation-delay: .8s; }
.d4 { top: 34%; left: 18%; animation-delay: 1s; }

.orbit-label {
  margin-top: 12px;
  color: #70dfff;
  font-size: 11px;
  letter-spacing: 3px;
  text-align: center;
}

.state-row {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.state {
  padding: 6px 9px;
  border: 1px solid #16516b;
  border-radius: 20px;
  color: #6d9cae;
  font-size: 10px;
  letter-spacing: 1px;
}

.state.active {
  color: var(--cyan);
  border-color: var(--cyan);
  box-shadow: 0 0 10px #00cfff33;
}

.wave {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  margin: 4px 0 14px;
  overflow: hidden;
}

.wave span {
  width: 3px;
  height: 6px;
  border-radius: 5px;
  background: var(--cyan);
  box-shadow: 0 0 7px #00cfff;
  animation: wave 1s ease-in-out infinite alternate;
  animation-play-state: paused;
}

.wave span:nth-child(3n) { animation-delay: -.3s; }
.wave span:nth-child(4n) { animation-delay: -.6s; }
.wave span:nth-child(5n) { animation-delay: -.8s; }

body.busy .wave span,
body.listening .wave span,
body.speaking .wave span {
  animation-play-state: running;
}

body.busy .ring { animation-duration: 1.2s; }
body.listening .radar { box-shadow: 0 0 35px #00d9ff55; }
body.speaking .core { animation-duration: .45s; }
</style>
</head>
 
<style>
#chat {
  width: 100%;
  max-width: 700px;
  min-height: 100px;
  max-height: 260px;
  overflow-y: auto;
  padding: 14px;
  margin: 16px auto;
  border: 1px solid #00d9ff55;
  border-radius: 12px;
  background: #00101acc;
  box-sizing: border-box;
}
.msg {
  padding: 10px 12px;
  margin: 8px 0;
  border-radius: 9px;
  overflow-wrap: anywhere;
  line-height: 1.5;
}
.jarvis {
  color: #9beeff;
  background: #00d9ff12;
  border-left: 3px solid #00d9ff;
}
.user {
  color: #fff;
  background: #ffffff10;
  border-left: 3px solid #888;
}
.controls, .actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
  width: 100%;
  max-width: 700px;
  margin: 12px auto;
}
input {
  flex: 1 1 180px;
  min-width: 0;
  padding: 13px;
  color: #eafaff;
  background: #061522;
  border: 1px solid #00d9ff88;
  border-radius: 9px;
  outline: none;
}
input:focus {
  border-color: #00eaff;
  box-shadow: 0 0 10px #00d9ff44;
}
button {
  padding: 12px 15px;
  color: #eafaff;
  background: #062334;
  border: 1px solid #00d9ff99;
  border-radius: 9px;
  cursor: pointer;
}
button:active {
  transform: scale(.97);
}
button:disabled {
  opacity: .5;
  cursor: not-allowed;
}
.actions .ai-button {
  background: #064052;
}
#detectVoicesBtn {
  display: block;
  margin: 12px auto;
}
#voiceResults {
  width: 100%;
  max-width: 700px;
  margin: 12px auto;
  color: #bcefff;
  font-size: 13px;
  overflow-wrap: anywhere;
}
#voiceResults h3 {
  color: #00d9ff;
}
.voice-item {
  padding: 10px;
  margin: 7px 0;
  border: 1px solid #00d9ff44;
  border-radius: 8px;
  background: #001522;
}
.voice-item strong {
  color: #fff;
}
.voice-id {
  color: #8daebc;
  font-size: 11px;
  overflow-wrap: anywhere;
}
@keyframes rotate {
  to { transform: rotate(360deg); }
}
@keyframes pulse {
  50% { opacity: .55; }
}
@keyframes blink {
  50% { opacity: .25; }
}
@keyframes wave {
  50% { transform: scaleY(1.8); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>

<body>
<header>
  <div class="brand">STARK TECHNOLOGY</div>
  <h1>J.A.R.V.I.S.</h1>
  <div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
</header>

<section class="visual">
  <div class="radar" id="radar">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div class="sweep"></div>
    <div class="core"></div>
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
  </div>
  <div class="state-row">
    <span class="dot-status" id="dot"></span>
    <span id="status" role="status">SISTEMA PRONTO</span>
  </div>
</section>

<div class="wave" id="wave" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span>
  <span></span>
</div>

<div id="chat" aria-live="polite">
  <div class="msg jarvis">
    J.A.R.V.I.S.: Sistema iniciado. Como posso ajudar?
  </div>
</div>

<div class="controls">
  <input id="userInput" type="text"
    placeholder="Escreva um comando..."
    aria-label="Escreva uma mensagem">
  <button id="sendBtn" onclick="sendMessage()">Enviar</button>
</div>

<div class="actions">
  <button id="micBtn" onclick="toggleVoice()">🎙️ Falar</button>
  <button id="stopBtn" onclick="stopSpeaking()">🔇 Parar voz</button>
  <button id="clearBtn" onclick="clearChat()">🗑️ Limpar chat</button>
</div>

<button id="detectVoicesBtn" onclick="detectJarvisVoices()">
  🔎 Detetar vozes disponíveis
</button>

<div id="voiceResults" aria-live="polite"></div>

<script>
function detectJarvisVoices() {
  const output = document.getElementById("voiceResults");

  if (!("speechSynthesis" in window)) {
    output.textContent =
      "Este navegador não disponibiliza síntese de voz.";
    return;
  }

  output.textContent = "A procurar vozes disponíveis...";

  function showVoices() {
    const voices = window.speechSynthesis.getVoices();

    if (!voices.length) {
      output.textContent =
        "Nenhuma voz encontrada ainda. Tenta novamente em alguns segundos.";
      return;
    }

    output.innerHTML = "<h3>Vozes disponíveis: " +
      voices.length + "</h3>";

    voices.forEach(function(voice, index) {
      const item = document.createElement("div");
      item.className = "voice-item";

      const name = document.createElement("strong");
      name.textContent = (index + 1) + ". " + voice.name;

      const details = document.createElement("div");
      details.textContent =
        "Idioma: " + (voice.lang || "Não indicado") +
        " | Padrão: " + (voice.default ? "Sim" : "Não");

      const id = document.createElement("div");
      id.className = "voice-id";
      id.textContent = "Identificador: " + voice.voiceURI;

      item.appendChild(name);
      item.appendChild(details);
      item.appendChild(id);
      output.appendChild(item);
    });
  }

  window.speechSynthesis.onvoiceschanged = showVoices;
  showVoices();
}

function onNativeVoicesListed(jsonText) {
  const output = document.getElementById("voiceResults");

  try {
    const voices = JSON.parse(jsonText);
    output.innerHTML = "<h3>Vozes Android disponíveis: " +
      voices.length + "</h3>";

    voices.forEach(function(voice, index) {
      const item = document.createElement("div");
      item.className = "voice-item";

      const name = document.createElement("strong");
      name.textContent = (index + 1) + ". " +
        (voice.name || "Voz sem nome");

      const details = document.createElement("div");
      details.textContent =
        "Idioma: " + (voice.locale || "Não indicado");

      item.appendChild(name);
      item.appendChild(details);
      output.appendChild(item);
    });
  } catch (error) {
    output.textContent =
      "Não foi possível interpretar a lista de vozes do Android.";
  }
}
</script>
  
<script>
"use strict";

let voiceOn = true;
let listening = false;
let recognition = null;
let waitingForModel = false;

const input = document.getElementById("userInput");
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const statusDot = document.getElementById("dot");
const micBtn = document.getElementById("micBtn");

function setStatus(message, state) {
  statusText.textContent = message;
  document.body.classList.remove(
    "busy", "listening", "speaking"
  );

  if (state) {
    document.body.classList.add(state);
  }

  if (statusDot) {
    statusDot.style.background =
      state === "listening" ? "#00ff99" :
      state === "busy" ? "#ffcc00" :
      state === "speaking" ? "#00d9ff" : "#7b8794";
  }
}

function addMessage(message, sender) {
  const item = document.createElement("div");
  item.className = "msg " +
    (sender === "user" ? "user" : "jarvis");

  item.textContent =
    (sender === "user" ? "TU: " : "J.A.R.V.I.S.: ") +
    message;

  chat.appendChild(item);
  chat.scrollTop = chat.scrollHeight;
}

function speak(message) {
  if (!voiceOn || !message) return;

  try {
    if (window.AndroidVoice &&
        typeof AndroidVoice.speak === "function") {
      AndroidVoice.speak(String(message));
      setStatus("A FALAR", "speaking");
      return;
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(
        String(message)
      );

      utterance.lang = "pt-BR";
      utterance.rate = 1;
      utterance.pitch = 1;

      utterance.onstart = function() {
        setStatus("A FALAR", "speaking");
      };

      utterance.onend = function() {
        setStatus("SISTEMA PRONTO", "");
      };

      utterance.onerror = function() {
        setStatus("SISTEMA PRONTO", "");
      };

      window.speechSynthesis.speak(utterance);
    }
  } catch (error) {
    setStatus("VOZ INDISPONÍVEL", "");
  }
}

function stopSpeaking() {
  try {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }

    if (window.AndroidVoice &&
        typeof AndroidVoice.stopSpeaking === "function") {
      AndroidVoice.stopSpeaking();
    }
  } catch (error) {
    // Mantém o sistema disponível mesmo se a voz falhar.
  }

  setStatus("SISTEMA PRONTO", "");
}

function clearChat() {
  chat.replaceChildren();

  addMessage(
    "Histórico limpo. Estou pronto para receber comandos.",
    "jarvis"
  );
}

function reply(message) {
  addMessage(message, "jarvis");
  speak(message);
}

function openWebsite(url) {
  try {
    window.open(url, "_blank");
  } catch (error) {
    window.location.href = url;
  }
}

function answer(rawText) {
  const text = rawText.toLowerCase().trim();

  if (
    text.includes("que horas") ||
    text.includes("hora atual")
  ) {
    return "A hora indicada pelo dispositivo é " +
      new Date().toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
      }) + ".";
  }

  if (
    text.includes("que dia") ||
    text.includes("data de hoje") ||
    text.includes("data atual")
  ) {
    return "Hoje é " +
      new Date().toLocaleDateString("pt-BR") + ".";
  }

  if (
    text.includes("quem és") ||
    text.includes("quem e voce") ||
    text.includes("quem é você") ||
    text.includes("quem es tu")
  ) {
    return "Sou o J.A.R.V.I.S., o teu assistente digital.";
  }

  if (
    text.includes("olá") ||
    text.includes("ola") ||
    text.includes("bom dia") ||
    text.includes("boa tarde") ||
    text.includes("boa noite")
  ) {
    return "Olá! Sistema operacional. Em que posso ajudar?";
  }

  if (
    text.includes("youtube") &&
    (
      text.includes("abrir") ||
      text.includes("ir para") ||
      text.includes("acessar")
    )
  ) {
    openWebsite("https://www.youtube.com/");
    return "A abrir o YouTube.";
  }

  if (
    text.includes("google") &&
    (
      text.includes("abrir") ||
      text.includes("pesquisar") ||
      text.includes("ir para")
    )
  ) {
    openWebsite("https://www.google.com/");
    return "A abrir o Google.";
  }

  if (
    text.includes("pesquisa") ||
    text.includes("pesquisar") ||
    text.includes("procura na internet")
  ) {
    openWebsite(
      "https://www.google.com/search?q=" +
      encodeURIComponent(rawText)
    );
    return "A preparar a pesquisa na internet.";
  }

  if (
    text.includes("obrigado") ||
    text.includes("obrigada")
  ) {
    return "Sempre às ordens. Como posso ajudar a seguir?";
  }

  if (
    text.includes("desligar voz") ||
    text.includes("silenciar")
  ) {
    voiceOn = false;
    return "Voz desativada. Continuarei a responder por texto.";
  }

  if (
    text.includes("ativar voz") ||
    text.includes("ligar voz")
  ) {
    voiceOn = true;
    return "Voz ativada.";
  }

  return null;
}

function sendMessage() {
  if (waitingForModel) return;

  const message = input.value.trim();
  if (!message) return;

  input.value = "";
  addMessage(message, "user");

  const localAnswer = answer(message);

  if (localAnswer !== null) {
    reply(localAnswer);
    return;
  }

  askModel(message);
}

function askModel(message) {
  setStatus("A PROCESSAR", "busy");

  if (
    window.AndroidVoice &&
    typeof AndroidVoice.askModel === "function"
  ) {
    waitingForModel = true;

    try {
      AndroidVoice.askModel(message);
    } catch (error) {
      waitingForModel = false;
      reply(
        "Não consegui comunicar com o modelo Android. " +
        "Verifica a integração na MainActivity.kt."
      );
      setStatus("SISTEMA PRONTO", "");
    }

    return;
  }

  waitingForModel = false;

  reply(
    "Ainda não tenho um modelo de inteligência artificial " +
    "ligado neste ambiente. Os comandos locais continuam " +
    "disponíveis. Para responder a outras perguntas, " +
    "preciso de um modelo ou serviço de IA integrado."
  );

  setStatus("SISTEMA PRONTO", "");
}

function onNativeModelResponse(response) {
  waitingForModel = false;

  let message = String(response || "").trim();

  if (!message) {
    message = "Não recebi uma resposta do modelo.";
  }

  reply(message);
  setStatus("SISTEMA PRONTO", "");
}

function onNativeSpeechResult(result) {
  const transcript = String(result || "").trim();

  listening = false;

  if (micBtn) {
    micBtn.textContent = "🎙️ Falar";
  }

  if (transcript) {
    input.value = transcript;
    sendMessage();
  } else {
    setStatus("NÃO OUVI NADA", "");
  }
}

function onNativeSpeechError(error) {
  listening = false;

  if (micBtn) {
    micBtn.textContent = "🎙️ Falar";
  }

  setStatus(
    "ERRO NO MICROFONE: " + String(error || "desconhecido"),
    ""
  );
}

function startMic() {
  if (
    window.AndroidVoice &&
    typeof AndroidVoice.startListening === "function"
  ) {
    try {
      listening = true;
      micBtn.textContent = "⏹️ A ouvir...";
      setStatus("A OUVIR", "listening");
      AndroidVoice.startListening();
    } catch (error) {
      listening = false;
      setStatus("FALHA NO MICROFONE", "");
    }

    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    reply(
      "O reconhecimento de voz não está disponível neste " +
      "navegador. Experimenta utilizar o microfone do Android."
    );
    setStatus("SISTEMA PRONTO", "");
    return;
  }

  if (!recognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "pt-BR";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function(event) {
      const transcript =
        event.results[0][0].transcript;

      onNativeSpeechResult(transcript);
    };

    recognition.onerror = function(event) {
      onNativeSpeechError(event.error);
    };

    recognition.onend = function() {
      listening = false;
      micBtn.textContent = "🎙️ Falar";
      if (!waitingForModel) {
        setStatus("SISTEMA PRONTO", "");
      }
    };
  }

  try {
    listening = true;
    micBtn.textContent = "⏹️ A ouvir...";
    setStatus("A OUVIR", "listening");
    recognition.start();
  } catch (error) {
    listening = false;
    micBtn.textContent = "🎙️ Falar";
    setStatus("NÃO FOI POSSÍVEL INICIAR O MICROFONE", "");
  }
}

function toggleVoice() {
  if (listening) {
    try {
      if (recognition) {
        recognition.stop();
      }

      if (
        window.AndroidVoice &&
        typeof AndroidVoice.stopListening === "function"
      ) {
        AndroidVoice.stopListening();
      }
    } catch (error) {
      // O reconhecimento pode já ter terminado.
    }

    listening = false;
    micBtn.textContent = "🎙️ Falar";
    setStatus("SISTEMA PRONTO", "");
    return;
  }

  startMic();
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});

setStatus("SISTEMA PRONTO", "");
