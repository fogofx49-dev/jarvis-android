
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Corrigir AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8-sig").lstrip()

          if not content.startswith('<?xml'):
              raise SystemExit("Erro: declaração XML não encontrada no início do manifesto.")

          path.write_text(content, encoding="utf-8")
          print("Início do manifesto corrigido.")
          PY

      - name: Validar AndroidManifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          ET.parse(path)
          print("XML válido")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
