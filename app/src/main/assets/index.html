<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S. | Stark Technology</title>
<style>
:root{--cyan:#00d9ff;--bg:#050a12;--panel:rgba(7,17,30,.94);--text:#eaf6ff;--muted:#829bb4;--border:rgba(0,217,255,.35)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(ellipse at 50% 27%,#10304b,transparent 48%),linear-gradient(145deg,#02050a,#091626 55%,#02050a);font-family:Arial,Helvetica,sans-serif;padding:14px}
.app{width:min(100%,650px);margin:auto}
header{text-align:center;padding:9px 0}
.brand{font-size:10px;letter-spacing:5px;color:var(--cyan);font-weight:bold}
h1{font-size:38px;letter-spacing:4px;margin:9px 0;color:#f0f8ff;text-shadow:0 0 12px #00aaff}
.statusbar{display:flex;align-items:center;justify-content:center;gap:9px;margin:15px 0;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#00ffad;box-shadow:0 0 12px #00ffad}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:10px}
.panel-title{padding:11px 14px;color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:2px;border-bottom:1px solid var(--border)}
.response{min-height:80px;padding:13px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.input-bar{display:flex;align-items:center;background:rgba(10,22,38,0.95);border:1px solid var(--border);border-radius:28px;padding:6px 12px;margin:12px 0;gap:8px}
.input-bar input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;padding:6px}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
button{border:1px solid var(--border);color:var(--cyan);background:#007bff10;border-radius:10px;padding:11px 8px;font-size:11px;font-weight:bold;cursor:pointer}
button:hover{background:#00d9ff1b}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">STARK TECHNOLOGY</div>
    <h1>J.A.R.V.I.S.</h1>
  </header>
  <div class="statusbar"><span class="dot"></span><span id="status">Sistemas operacionais online.</span></div>

  <section class="panel">
    <div class="panel-title">▸ REGISTRO DE COMANDOS</div>
    <div class="response" id="response">Aguardando diretivas, chefe.</div>
  </section>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Peça algo ao J.A.R.V.I.S..." onkeydown="handleKey(event)">
    <button type="button" onclick="toggleMicrophone()">🎙️ Falar</button>
  </div>

  <div class="controls">
    <button type="button" onclick="runGoodMorningRoutine()">☀️ Bom dia, Jarvis</button>
    <button type="button" onclick="chooseModel()">📂 Carregar Modelo IA</button>
  </div>
</div>

<script>
const responseBox = document.getElementById("response");
const statusBox = document.getElementById("status");
const userInput = document.getElementById("userInput");

function appendMessage(sender, text) {
  responseBox.textContent = text;
}

function handleKey(event) {
  if (event.key === "Enter") submitText();
}

function submitText() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = "";
  if (window.AndroidVoice && window.AndroidVoice.askModel) {
    window.AndroidVoice.askModel(text);
  }
}

function toggleMicrophone() {
  if (window.AndroidVoice && window.AndroidVoice.startListening) {
    window.AndroidVoice.startListening();
  }
}

function chooseModel() {
  if (window.AndroidVoice && window.AndroidVoice.chooseModel) {
    window.AndroidVoice.chooseModel();
  }
}

function runGoodMorningRoutine() {
  submitText("bom dia");
}

window.onCloudAIResponse = function(answer) {
  appendMessage('JARVIS', answer);
};

window.onNativeStatus = function(msg) {
  statusBox.textContent = msg;
};
</script>
</body>
</html>
